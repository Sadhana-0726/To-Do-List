<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="todo-app">
    <h1>Task Manager</h1>
    
    <form id="todo-form">
      <input type="text" id="todo-input" placeholder="What needs to be done?" required autocomplete="off">
      <button type="submit">Add Task</button>
    </form>

    <div class="filter-group" id="filter-buttons">
      <button data-filter="all" class="filter-btn active">All</button>
      <button data-filter="active" class="filter-btn">Active</button>
      <button data-filter="completed" class="filter-btn">Completed</button>
    </div>

    <ul id="todo-list" class="todo-list"></ul>

    <div class="footer">
      <span id="task-count">0 tasks remaining</span>
      <button id="clear-completed">Clear Completed</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
